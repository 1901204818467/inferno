name: Delete Discord Reminder
concurrency:
  group: delete-reminder
  cancel-in-progress: true
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
env:
  WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
jobs:
  delete-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Delete reminder message after 3 hours
        run: |
          if [ ! -f .github/reminder-state.json ]; then
            echo "no stored message, nothing to do"
            exit 0
          fi
          sent_at=$(jq -r '.sent_at // 0' .github/reminder-state.json || true)
          case "$sent_at" in
            *[!0-9]*)
              echo "invalid sent_at in state file"
              exit 0
              ;;
          esac
          if [ -z "$sent_at" ] || [ "$sent_at" = "0" ]; then
            echo "state file contains no message"
            exit 0
          fi
          now=$(date +%s)
          if [ $((now - sent_at)) -lt 10800 ]; then
            echo "reminder message is not 3 hours old yet, skipping"
            exit 0
          fi

          python3 .github/scripts/purge-messages.py || echo "purge failed"
          if [ -f "$RUNNER_TEMP/survivor-ids.json" ]; then
            kept=$(cat "$RUNNER_TEMP/survivor-ids.json")
            if [ "$kept" = "[]" ]; then
              printf '{"ids":[],"sent_at":0}\n' > .github/reminder-state.json
            else
              printf '{"ids":%s,"sent_at":%s}\n' "$kept" "$sent_at" > .github/reminder-state.json
            fi
          else
            echo "purge did not complete, keeping state for a later attempt"
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/reminder-state.json
          git commit -m "clear reminder state" || echo "nothing to commit"
          git push || echo "warning: state push failed"
