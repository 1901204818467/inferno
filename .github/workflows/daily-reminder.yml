name: Daily Discord Reminder
concurrency:
  group: daily-reminder
  cancel-in-progress: true
on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
env:
  WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  USER_ID: ${{ secrets.DISCORD_USER_ID }}
jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge all previous reminder messages
        run: |
          python3 .github/scripts/purge-messages.py || echo "purge failed, will retry on next run"

      - name: Fetch animal fact, prices, and shopping list
        run: |
          python3 .github/scripts/fetch-data.py || echo "data fetch failed, using fallbacks"

      - name: Send reminder and save state
        run: |
          fact=""
          image=""
          animal_title="Animal Fact"
          if [ -f "$RUNNER_TEMP/animal-fact.txt" ]; then
            fact=$(cat "$RUNNER_TEMP/animal-fact.txt")
          fi
          if [ -f "$RUNNER_TEMP/animal-image.txt" ]; then
            image=$(cat "$RUNNER_TEMP/animal-image.txt")
          fi
          if [ -f "$RUNNER_TEMP/animal-name.txt" ]; then
            animal_title=$(cat "$RUNNER_TEMP/animal-name.txt")
          fi

          shop_list=$(printf '675x Crude Gabagool - free\n25x Sulphuric Coal\n150x Gabagool Distillate\n50x Inferno Fuel Block')
          if [ -f "$RUNNER_TEMP/shopping-list.txt" ]; then
            shop_list=$(cat "$RUNNER_TEMP/shopping-list.txt")
          fi
          craft_steps=$(printf '/recipe gabagool\n1. 25x fuel gabagool supercraft\n2. 25x rare inferno minion fuel supercraft')

          profit_text=""
          if [ -f "$RUNNER_TEMP/profit.txt" ]; then
            profit_text=$(cat "$RUNNER_TEMP/profit.txt")
          fi
          icon="https://static.wikia.nocookie.net/hypixel-skyblock/images/3/36/Inferno_Minion_Render.png/revision/latest/scale-to-width-down/256?cb=20220805231410"

          fields_json=$(jq -n --arg shop "$shop_list" --arg craft "$craft_steps" '[{name: "Shopping List", value: $shop}, {name: "Crafting", value: $craft}]')
          if [ -n "$profit_text" ]; then
            fields_json=$(jq -n --argjson base "$fields_json" --arg profit "$profit_text" '$base + [{name: "Daily Profit", value: $profit}]')
          fi
          main_embed=$(jq -n \
            --arg icon "$icon" \
            --argjson fields "$fields_json" \
            '{color: 16739125, author: {name: "Inferno Minion", icon_url: $icon}, fields: $fields}')

          if [ -n "$fact" ]; then
            if [ -n "$image" ]; then
              animal_embed=$(jq -n --arg title "$animal_title" --arg desc "$fact" --arg img "$image" '{title: $title, description: $desc, image: {url: $img}}')
            else
              animal_embed=$(jq -n --arg title "$animal_title" --arg desc "$fact" '{title: $title, description: $desc}')
            fi
            embeds=$(jq -n --argjson a "$main_embed" --argjson b "$animal_embed" '[$a, $b]')
          else
            embeds=$(jq -n --argjson a "$main_embed" '[$a]')
          fi

          payload=$(jq -n --arg uid "$USER_ID" --argjson embeds "$embeds" '{content: ("<@" + $uid + ">"), embeds: $embeds}')

          response=$(curl -s --max-time 30 --retry 3 --retry-delay 5 -H "Content-Type: application/json" -d "$payload" "${WEBHOOK_URL}?wait=true")
          message_id=$(printf '%s' "$response" | jq -r '.id // empty' || true)
          if [ -z "$message_id" ]; then
            echo "Failed to send reminder: $(printf '%s' "$response" | head -c 300)"
            exit 1
          fi

          kept='[]'
          if [ -f "$RUNNER_TEMP/survivor-ids.json" ]; then
            kept=$(cat "$RUNNER_TEMP/survivor-ids.json")
          fi
          new_ids=$(jq -n --arg new "$message_id" --argjson kept "$kept" '$kept[-49:] + [$new]')
          printf '{"ids":%s,"sent_at":%s}\n' "$new_ids" "$(date +%s)" > .github/reminder-state.json
          echo "new state: $(cat .github/reminder-state.json)"

          python3 .github/scripts/update-stats.py

          python3 .github/scripts/generate-chart.py

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A -- .github/reminder-state.json prices.json prices.jsonl stats.json chart.svg
          if git diff --cached --quiet HEAD; then
            echo "no changes to commit"
          else
            git commit -m "update reminder state and price snapshots"
            git fetch origin
            git merge origin/main --no-edit || true
            git checkout HEAD -- .github/reminder-state.json prices.json prices.jsonl stats.json chart.svg
            git add -A -- .github/reminder-state.json prices.json prices.jsonl stats.json chart.svg
            git commit -m "resolve data files" || true
            git push origin HEAD:main || { echo "state push failed - reminder may not be purged" >&2; exit 1; }
          fi
