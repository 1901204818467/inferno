name: Reminder Watchdog
permissions:
  contents: write
  actions: write
on:
  schedule:
    - cron: '50 21 * * *'
    - cron: '*/10 22-23 * * *'
  workflow_dispatch:
concurrency:
  group: reminder-watchdog
  cancel-in-progress: true
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check if reminder already sent today
        id: check
        run: |
          need="yes"
          if [ -f .github/reminder-state.json ]; then
            sent_at=$(jq -r '.sent_at // 0' .github/reminder-state.json 2>/dev/null || echo 0)
            case "$sent_at" in ''|*[!0-9]*) sent_at=0 ;; esac
            if [ "$sent_at" -gt 0 ]; then
              now=$(date +%s)
              if [ "$sent_at" -le "$now" ]; then
                today=$(TZ='Etc/GMT-3' date +%F)
                sent_day=$(TZ='Etc/GMT-3' date -d "@${sent_at}" +%F)
                if [ "$sent_day" = "$today" ]; then
                  need="no"
                fi
              fi
            fi
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "watchdog: need=$need"

      - name: Throttle repeated dispatches
        id: throttle
        run: |
          ok="yes"
          if [ -f .github/dispatch-marker.json ]; then
            mdate=$(jq -r '.date // ""' .github/dispatch-marker.json 2>/dev/null || echo "")
            mepoch=$(jq -r '.last_dispatch_epoch // 0' .github/dispatch-marker.json 2>/dev/null || echo 0)
            case "$mepoch" in ''|*[!0-9]*) mepoch=0 ;; esac
            today=$(TZ=Europe/Moscow date +%F)
            now=$(date +%s)
            if [ "$mdate" = "$today" ] && [ "$mepoch" -gt 0 ] && [ $(( now - mepoch )) -lt 1800 ]; then
              ok="no"
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "watchdog: throttle_ok=$ok"

      - name: Dispatch daily reminder
        if: ${{ steps.check.outputs.need == 'yes' && steps.throttle.outputs.ok == 'yes' }}
        run: |
          printf '{"date":"%s","last_dispatch_epoch":%s}\n' "$(TZ='Etc/GMT-3' date +%F)" "$(date +%s)" > .github/dispatch-marker.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/dispatch-marker.json
          git commit -m "watchdog dispatch marker" || true
          git push origin HEAD:main || echo "marker push failed, will retry on next tick"
          gh workflow run daily-reminder.yml
        env:
          GH_TOKEN: ${{ github.token }}
